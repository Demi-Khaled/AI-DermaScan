version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dermascan_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dermascan
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dermascan_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=mysql://mysqluser:password123@db:3306/dermascan
      - JWT_SECRET=supersecret_dermaskann_key_12345
      - AI_SERVICE_URL=http://ai-service:5000/predict
    depends_on:
      - db
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dermascan_ai
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dermascan_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata:
